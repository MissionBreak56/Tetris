<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tetris</title>
<style>
  :root{--acc:#6aa3ff;--glow:61,120,255;--dk:18,40,170;--btnbg:8,16,70;--b1:#2f58e6;--b2:#1a2f9e;--cell:40px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:#05072a;color:#eaf0ff;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  .sheetp canvas{position:static;width:100%;height:auto;max-width:100%}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(3,5,35,.78);z-index:20;touch-action:manipulation}
  .overlay.on{display:flex}
  .overlay.on .panel{animation:popin .28s cubic-bezier(.2,1.4,.4,1)}
  @keyframes popin{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
  .panel{background:linear-gradient(#0c1456ee,#050a35ee);border:3px solid var(--acc);
    box-shadow:0 0 28px rgba(var(--glow),.65),inset 0 0 18px rgba(var(--glow),.25);
    border-radius:20px;padding:26px 32px;text-align:center;min-width:290px;max-width:92vw;max-height:96vh;overflow:auto}
  .panel h1{margin:0 0 6px;font-size:34px;letter-spacing:5px;color:#fff;
    text-shadow:0 0 10px var(--acc),0 0 24px #2f6bff;animation:glow 1.8s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 6px var(--acc),0 0 14px #2f6bff}to{text-shadow:0 0 14px #9bbcff,0 0 36px #3d78ff}}
  .panel h2{margin:0 0 14px;font-size:20px}
  .sub{color:#9fb4ee;margin-bottom:14px;font-size:14px}
  .btn{display:block;width:100%;margin:9px 0;padding:13px 18px;font-size:17px;font-weight:600;
    background:linear-gradient(var(--b1),var(--b2));color:#fff;border:1px solid var(--acc);border-radius:12px;
    box-shadow:0 0 12px rgba(var(--glow),.5);cursor:pointer;font-family:inherit;transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.2)}
  .btn:active{transform:scale(.95)}
  .btn.small{padding:9px 10px;font-size:14px;font-weight:500;background:rgb(var(--btnbg))}
  .row{display:flex;gap:8px}.row .btn{flex:1}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
  .grid .btn{margin:0;padding:11px 0}
  .swatches{display:flex;gap:12px;justify-content:center;margin:14px 0}
  .sw{width:54px;height:54px;border-radius:12px;border:3px solid var(--acc);cursor:pointer;transition:transform .1s}
  .sw:active{transform:scale(.9)}
  .stat{font-size:19px;margin:5px 0}.stat b{color:#ffd54a}
  #msg{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.4);
    font-size:30px;font-weight:800;color:#ffe066;letter-spacing:3px;white-space:nowrap;
    text-shadow:0 0 12px #ff9d00,0 3px 12px #000;opacity:0;pointer-events:none;z-index:15}
  #msg.pop{animation:msgpop 1.1s ease-out forwards}
  @keyframes msgpop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    14%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
    28%{transform:translate(-50%,-50%) scale(1)}
    75%{opacity:1;transform:translate(-50%,-62%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-85%) scale(1)}}
  #count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    font-size:130px;font-weight:800;color:#fff;text-shadow:0 0 20px var(--acc),0 0 50px #2f6bff;z-index:18;pointer-events:none}
  #count.cpop{animation:cpop .65s ease-out}
  @keyframes cpop{0%{transform:scale(2.2);opacity:0}35%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.2}}
  #pauseBtn{position:fixed;z-index:10;display:none;align-items:center;justify-content:center;
    background:#070d3a;border:4px solid var(--acc);border-radius:18px;cursor:pointer;padding:0;
    box-shadow:0 0 16px rgba(var(--glow),.8),inset 0 0 10px rgba(var(--glow),.4);transition:transform .08s}
  #pauseBtn:active{transform:scale(.9)}
  #pauseBtn i{display:block;width:16%;height:42%;background:#fff;margin:0 7%;border-radius:2px}
  .row.wrap{flex-wrap:wrap}.row.wrap .btn{flex:1 1 30%}
  .sheetp{width:min(94vw,440px);text-align:left}.sheetp h2{text-align:center}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(var(--glow),.25);font-size:15px}
  .kv b{color:#ffd54a;text-align:right}.sec{margin:12px 0 4px;color:var(--acc);font-weight:700;font-size:13px;letter-spacing:1px}
  .btn.danger{background:linear-gradient(#b3262d,#701419);border-color:#ff8a8a}
  .newrec{margin:10px 0 2px;color:#ffd54a;font-weight:800;text-align:center;animation:glow 1.2s ease-in-out infinite alternate}
  #confirmBox{z-index:40}
  .slrow{display:grid;grid-template-columns:1fr 1.2fr 48px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
  .slrow input{width:100%;accent-color:var(--acc)}.slrow b{color:#ffd54a;text-align:right;font-size:13px}
  .achv{margin:8px 0;opacity:.6}.achv.done{opacity:1}.achv .kv{border:0;padding:2px 0}
  .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
  #msg2{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:20px;font-weight:800;letter-spacing:2px;white-space:nowrap;opacity:0;pointer-events:none;z-index:15;color:#9bf0ff;text-shadow:0 0 10px #2fb8ff,0 2px 8px #000}
  #msg2.pop{animation:msg2pop 1.3s ease-out forwards}
  #msg2.m-perfect{color:#fff3b0;font-size:26px;text-shadow:0 0 14px #ffc400,0 0 28px #ff8a00}
  @keyframes msg2pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
  #msg.m-tetris{color:#ffe066;font-size:36px;text-shadow:0 0 16px #ff9d00,0 0 30px #ff5e00,0 3px 12px #000}
  #msg.m-tspin{color:#e0a8ff;text-shadow:0 0 14px #b44bff,0 3px 12px #000}
  #msg.m-b2b{color:#ffb35c;text-shadow:0 0 14px #ff6a00,0 3px 12px #000}
  #msg.m-lines{color:#fff;text-shadow:0 0 10px #6aa3ff,0 3px 12px #000}
  #msg.m-level{color:#9bf0ff;text-shadow:0 0 12px #2fb8ff,0 3px 12px #000}
  #msg.m-skill{color:#b8ffd0;text-shadow:0 0 12px #2fff88,0 3px 12px #000}
  #tut{display:none;position:fixed;left:3%;right:3%;bottom:1.5%;z-index:12;padding:10px 12px;border-radius:14px;background:rgba(var(--btnbg),.94);border:2px solid var(--acc);box-shadow:0 0 14px rgba(var(--glow),.6);font-size:14px;line-height:1.35}
  #tut .tp{float:right;color:#ffd54a;font-weight:700;margin-left:8px}#tut .btn{width:auto;margin:6px 6px 0 0;padding:6px 14px;font-size:13px}
  .skinrow{padding:8px;margin:8px 0;border:1px solid rgba(var(--glow),.35);border-radius:10px}.skinrow.sel{border-color:var(--acc);box-shadow:0 0 10px rgba(var(--glow),.5)}
  .skinrow canvas{display:block;margin-top:4px;max-width:100%}.chips{display:flex;gap:3px;margin:4px 0}.chips i{flex:1;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}
  .txt{width:100%;box-sizing:border-box;background:rgba(0,0,0,.35);color:#fff;border:1px solid var(--acc);border-radius:8px;padding:8px;font-size:14px;margin:6px 0}
  .prev{display:block;margin:6px auto;border-radius:8px;max-width:100%}.errs{font-size:12px;color:#ff9a9a;margin:6px 0;min-height:16px}.errs.ok{color:#8affb0}
  input[type=color]{width:100%;height:30px;border:0;padding:0;background:none}.btn:disabled{opacity:.4}
  .spark{display:flex;align-items:flex-end;gap:3px;height:64px;margin:6px 0}.spark i{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-width:3px}
  #rpBar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:1.5%;z-index:12;gap:8px;align-items:center;padding:6px 10px;border-radius:14px;background:rgba(var(--btnbg),.94);border:2px solid var(--acc)}
  #rpBar .btn{width:auto;margin:0;padding:8px 14px;font-size:15px}
  .hint{font-size:12px;color:#9fb4ee;margin-top:10px;line-height:1.6}

  /* ===== Tela inicial ===== */
  #menu{background:transparent}
  .mb{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--cell)*.08);padding:0;font-family:inherit;color:#fff;cursor:pointer;
    background:linear-gradient(rgba(var(--glow),.22),rgba(var(--glow),.05)),rgb(var(--btnbg));
    border:calc(var(--cell)*.09) solid var(--acc);border-radius:calc(var(--cell)*.3);
    box-shadow:0 0 calc(var(--cell)*.4) rgba(var(--glow),.7),inset 0 0 calc(var(--cell)*.3) rgba(var(--glow),.45);
    transition:transform .08s,filter .15s;touch-action:manipulation}
  .mb:active{transform:scale(.94);filter:brightness(1.35)}
  .mb.mode{font-size:calc(var(--cell)*.95);font-weight:500;letter-spacing:calc(var(--cell)*.02);animation:mbin .45s both}
  .mb.mode:nth-of-type(3){animation-delay:.08s}.mb.mode:nth-of-type(4){animation-delay:.16s}
  @keyframes mbin{from{opacity:0;transform:translateY(calc(var(--cell)*.6)) scale(.92)}to{opacity:1;transform:none}}
  .mb.side{font-size:calc(var(--cell)*.34);font-weight:500;border-radius:calc(var(--cell)*.28)}
  .mb svg{width:calc(var(--cell)*.78);height:calc(var(--cell)*.78);fill:#fff;stroke:none;flex:none}
  .mb.off{color:#9aa8d8}.mb.off svg{opacity:.45}
  .slash{display:none;position:absolute;left:50%;top:calc(var(--cell)*.6);width:calc(var(--cell)*1);height:calc(var(--cell)*.075);
    background:#fff;border-radius:3px;transform:translate(-50%,-50%) rotate(-45deg);
    box-shadow:0 0 0 calc(var(--cell)*.035) rgb(var(--btnbg))}
  .mb.off .slash{display:block}
  .badge{display:none;position:absolute;right:calc(var(--cell)*-.18);top:calc(var(--cell)*-.18);min-width:calc(var(--cell)*.8);
    height:calc(var(--cell)*.8);padding:0 calc(var(--cell)*.15);align-items:center;justify-content:center;border-radius:calc(var(--cell)*.4);
    background:var(--acc);color:#001040;font-size:calc(var(--cell)*.46);font-weight:800}
  .badge.on{display:flex}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="pauseBtn"><i></i><i></i></button>
<div id="rpBar"><button class="btn small" id="rpPlay">❚❚</button><button class="btn small" id="rpSpeed">×1</button><button class="btn small" id="rpExit">Sair</button></div>
<div id="tut"><span class="tp" id="tutProg"></span><span id="tutText"></span><br><button class="btn small" id="tutOk">Entendi</button><button class="btn small" id="tutSkip">Pular tutorial</button></div>
<div id="msg"></div>
<div id="msg2"></div>
<div id="count"></div>

<div class="overlay on" id="menu">
  <button class="mb side" id="bLevel" aria-label="Level"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>LEVEL<span class="badge" id="lvBadge">1</span></button>
  <button class="mb mode" id="bMarathon">CLASSIC</button>
  <button class="mb mode" id="bTimed">2 MINUTES</button>
  <button class="mb mode" id="bStrategy">STRATEGY</button>
  <button class="mb side" id="bTheme"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>THEME</button>
  <button class="mb side" id="tGhost"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="6.4" height="6.4"/><rect x="8.8" y="3" width="6.4" height="6.4"/><rect x="15.6" y="3" width="6.4" height="6.4"/><rect x="9.4" y="14.4" width="5.2" height="5.2" style="fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:2.2 1.6"/></svg>GHOST<i class="slash"></i></button>
  <button class="mb side" id="tMusic"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>MUSIC<i class="slash"></i></button>
  <button class="mb side" id="tSound"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>SOUND<i class="slash"></i></button>
</div>

<div class="overlay" id="sheet"><div class="panel sheetp"><h2 id="sheetTitle"></h2><div id="sheetBody"></div><button class="btn small" id="sheetBack">Voltar</button></div></div>
<div class="overlay" id="confirmBox"><div class="panel"><div class="stat" id="confirmText"></div><div class="row"><button class="btn small" id="confirmNo">Cancelar</button><button class="btn small danger" id="confirmYes">Confirmar</button></div></div></div>

<div class="overlay" id="pausePanel"><div class="panel sheetp"><h1>Paused!</h1><div id="pauseBody"></div></div></div>

<div class="overlay" id="endPanel"><div class="panel">
  <h1 id="endTitle">Game Over</h1>
  <div id="endStats"></div>
  <button class="btn" id="bRetry">Retry</button>
  <button class="btn" id="bEndHome">Home</button>
</div></div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/stats.js"></script>
<script src="js/history.js"></script>
<script src="js/achv.js"></script>
<script src="js/controls.js"></script>
<script src="js/native.js"></script>
<script src="js/actions.js"></script>
<script src="js/replay.js"></script>
<script src="js/analysis.js"></script>
<script src="js/ranking.js"></script>
<script src="js/profiles.js"></script>
<script src="js/skins.js"></script>
<script src="js/themes.js"></script>
<script src="js/settings.js"></script>
<script src="js/rules.js"></script>
<script src="js/modes.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/missions.js"></script>
<script src="js/daily.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/flow.js"></script>
<script src="js/core/renderer.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/app.js"></script>

</body>
</html>
