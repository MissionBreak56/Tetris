name: Tetris
options:
  bundleIdPrefix: com.missionbreak56
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "34"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Tetris:
    type: application
    platform: iOS
    sources:
      - path: Tetris
        excludes: ["Info.plist"]
      - path: ../app/src/main/assets      # o mesmo jogo (HTML/JS) do Android, copiado para o app como pasta "assets"
        type: folder
    info:
      path: Tetris/Info.plist
      properties:
        CFBundleDisplayName: Tetris
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBg
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "O Tetris usa a rede local (Wi-Fi) para jogar online contra outra pessoa no mesmo Wi-Fi ou hotspot."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missionbreak56.tetris
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
